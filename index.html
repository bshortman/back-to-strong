<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Back to Strong</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#111827;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:720px;margin:auto;padding:16px}header{background:#111827;color:white;border-radius:0 0 24px 24px;padding:25px 0}h1{margin:0;font-size:28px}.muted{color:#6b7280;font-size:13px}.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:16px;margin:0 0 14px}.tabs{display:flex;gap:8px}.tab,.btn{border:0;border-radius:12px;padding:12px;font-weight:800}.tab{flex:1;background:#e5e7eb}.active,.btn{background:#111827;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}select,input,textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:10px;font:inherit}.ex{border-top:1px solid #eee;padding:15px 0}.ex:first-child{border:0}.sets{display:grid;grid-template-columns:42px 1fr 1fr;gap:7px;margin-top:9px}.sets small{text-align:center;color:#6b7280}.prev{grid-column:1/-1;background:#eef2f7;border-radius:9px;padding:8px;font-size:12px;color:#475569}.btn{width:100%;margin-top:8px}.danger{background:#fee2e2;color:#991b1b}.bar{height:10px;background:#e5e7eb;border-radius:20px;overflow:hidden}.fill{height:100%;background:#16a34a}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{background:#f8fafc;border-radius:13px;padding:12px}.num{font-size:21px;font-weight:850}.week{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.wk{border:1px solid #e5e7eb;border-radius:10px;padding:9px;text-align:center;font-size:12px}.done{background:#dcfce7;border-color:#86efac}.timer{display:flex;justify-content:space-between;align-items:center}.time{font-size:28px;font-weight:850}</style></head>
<body><header><div class="wrap"><h1>BACK TO STRONG</h1><div style="color:#cbd5e1">Simple training. Consistent progress.</div></div></header><main class="wrap">
<div class="card"><b>Your 4-week comeback</b><div class="muted">3 sessions per week · 12 sessions total</div><div class="bar" style="margin-top:12px"><div id="bar" class="fill"></div></div><div id="pct" class="muted" style="margin-top:7px"></div></div>
<div class="card"><b>Week & workout</b><div class="grid" style="margin-top:10px"><select id="week"><option>1</option><option>2</option><option>3</option><option>4</option></select><div class="tabs"><button class="tab active" data-t="A">A</button><button class="tab" data-t="B">B</button></div></div></div>
<div id="workout"></div>
<div class="card"><div class="timer"><div><b>Rest timer</b><div class="muted">90 seconds</div></div><div id="time" class="time">1:30</div></div><button id="timerBtn" class="btn">Start rest timer</button></div>
<div class="card"><b>Cardio finisher</b><div class="muted">10–12 minutes</div><input id="cardio" placeholder="e.g. Bike · 12 min · level 7" style="margin-top:9px"></div>
<div class="card"><b>Session notes</b><textarea id="notes" placeholder="How did it feel?" style="margin-top:9px"></textarea></div>
<button id="finish" class="btn">✓ Complete session</button><button id="clear" class="btn danger">Clear this session</button>
<div class="card" style="margin-top:18px"><b>Progress dashboard</b><div id="stats" class="stats" style="margin-top:12px"></div><div class="muted" style="margin-top:15px">4-week history</div><div id="history"></div></div>
</main>
<script>
const W={A:[["Leg press",3,10,12],["Chest press machine",3,10,12],["Lat pulldown",3,10,12],["Dumbbell Romanian deadlift",3,10,10],["Seated cable row",2,10,12],["Dumbbell shoulder press",2,10,10]],B:[["Goblet squat",3,10,10],["Incline dumbbell press",3,10,10],["Seated cable row",3,10,12],["Leg curl machine",3,10,12],["Lat pulldown",2,10,12],["Dumbbell lateral raises",2,12,15]]};
let wk=+(localStorage.getItem("bts-wk")||1), typ=localStorage.getItem("bts-type")||"A", iv=null, sec=90;
const key=()=>`bts-${wk}-${typ}`, get=k=>JSON.parse(localStorage.getItem(k)||"{}"), save=d=>localStorage.setItem(key(),JSON.stringify(d));
function prev(name,s){for(let w=wk-1;w>0;w--){let d=get(`bts-${w}-${typ}`),a=d[name];if(a&&a[s]&&(a[s].weight!==""||a[s].reps!==""))return a[s]}return null}
function render(){document.getElementById("week").value=wk;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.t==typ));let d=get(key()),o='<div class="card"><b>Workout '+typ+'</b><div class="muted">Leave about 2–3 good reps in reserve.</div>';
W[typ].forEach((e,ei)=>{let [name,n,lo,hi]=e;o+=`<div class="ex"><b>${name}</b><div class="muted">${n} sets · ${lo}–${hi} reps</div><div class="sets"><small></small><small>Weight kg</small><small>Reps</small>`;
for(let s=0;s<n;s++){let v=(d[name]||[])[s]||{},p=prev(name,s);o+=`<small>Set ${s+1}</small><input data-e="${ei}" data-s="${s}" data-f="weight" value="${v.weight||""}" placeholder="${p&&p.weight!==""?p.weight+" kg":"kg"}"><input data-e="${ei}" data-s="${s}" data-f="reps" value="${v.reps||""}" placeholder="${p&&p.reps!==""?p.reps:"reps"}">`}let p=prev(name,0);if(p)o+=`<div class="prev">Previous: ${p.weight||"—"} kg × ${p.reps||"—"} reps</div>`;o+="</div></div>"});o+="</div>";document.getElementById("workout").innerHTML=o;document.getElementById("cardio").value=d.cardio||"";document.getElementById("notes").value=d.notes||"";document.querySelectorAll("#workout input").forEach(x=>x.oninput=()=>{let d=get(key()),name=W[typ][+x.dataset.e][0],s=+x.dataset.s;if(!d[name])d[name]=Array.from({length:W[typ][+x.dataset.e][1]},()=>({weight:"",reps:""}));d[name][s][x.dataset.f]=x.value;save(d);dash()})}
function extras(){let d=get(key());d.cardio=cardio.value;d.notes=notes.value;save(d)}
function dash(){let sessions=0,sets=0,vol=0,uniq=new Set(),weeks=0;for(let w=1;w<=4;w++){let active=false;["A","B"].forEach(t=>{let d=get(`bts-${w}-${t}`);if(d.finished){sessions++;active=true}W[t].forEach(e=>{(d[e[0]]||[]).forEach(v=>{if(v&&(v.weight!==""||v.reps!=="")){sets++;uniq.add(e[0])}if(v&&v.weight!==""&&v.reps!=="")vol+=+v.weight*+v.reps})})});if(active)weeks++}let p=Math.round(sessions/12*100);bar.style.width=p+"%";pct.textContent=`${sessions} / 12 sessions complete · ${p}%`;stats.innerHTML=[[sessions,"Sessions complete"],[sets,"Sets logged"],[Math.round(vol).toLocaleString()+" kg","Training volume"],[uniq.size+" / 12","Exercises started"],[weeks+" / 4","Weeks active"]].map(x=>`<div class="stat"><div class="num">${x[0]}</div><div class="muted">${x[1]}</div></div>`).join("");history.innerHTML=[1,2,3,4].map(w=>`<div style="margin-top:8px"><b>Week ${w}</b><div class="week">${["A","B"].map(t=>{let d=get(`bts-${w}-${t}`);return `<div class="wk ${d.finished?"done":""}">Workout ${t}<br>${d.finished?"✓ Complete":"Not completed"}</div>`}).join("")}</div></div>`).join("")}
week.onchange=e=>{wk=+e.target.value;localStorage.setItem("bts-wk",wk);render()};document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{typ=b.dataset.t;localStorage.setItem("bts-type",typ);render()});cardio.oninput=extras;notes.oninput=extras;
finish.onclick=()=>{let d=get(key());d.finished=true;d.finishedAt=new Date().toISOString();save(d);dash();alert(`Workout ${typ}, Week ${wk} complete!`)};clear.onclick=()=>{if(confirm("Clear this session?")){localStorage.removeItem(key());render();dash()}};
timerBtn.onclick=()=>{if(iv){clearInterval(iv);iv=null;timerBtn.textContent="Start rest timer";return}sec=90;timerBtn.textContent="Stop timer";iv=setInterval(()=>{sec--;time.textContent=`0:${String(sec).padStart(2,"0")}`;if(sec<=0){clearInterval(iv);iv=null;timerBtn.textContent="Start rest timer";navigator.vibrate?.([200,100,200])}},1000)};render();dash();
</script></body></html>
